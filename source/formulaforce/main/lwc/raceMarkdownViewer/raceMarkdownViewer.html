<template>
    <lightning-card title="Race Summary" icon-name="standard:article">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template lwc:if={hasContent}>
                <lightning-formatted-rich-text 
                    value={renderedMarkdown}
                    disable-linkify="false">
                </lightning-formatted-rich-text>
            </template>
            <template lwc:else>
                <div class="slds-text-align_center slds-p-vertical_large">
                    <lightning-icon 
                        icon-name="utility:info" 
                        size="medium" 
                        alternative-text="No content">
                    </lightning-icon>
                    <p class="slds-text-color_weak slds-m-top_small">
                        No race summary available
                    </p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
