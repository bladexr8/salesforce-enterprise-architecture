<template>
    <lightning-card title="F1 Lap Times" icon-name="custom:custom63">
        <div slot="actions">
            <lightning-button 
                variant="neutral" 
                label="Refresh" 
                title="Refresh Data"
                onclick={handleRefresh}
                icon-name="utility:refresh">
            </lightning-button>
        </div>
        
        <div class="slds-card__body slds-card__body_inner">
            <!-- Loading Spinner -->
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading lap times..." size="medium"></lightning-spinner>
            </template>

            <!-- Error Message -->
            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{error}</h2>
                </div>
            </template>

            <!-- Filter Controls -->
            <template lwc:if={hasData}>
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-dual-listbox
                            name="driverFilter"
                            label="Filter by Drivers"
                            placeholder="Select drivers to filter..."
                            source-label="Available Drivers"
                            selected-label="Selected Drivers"
                            options={driverOptions}
                            value={selectedDrivers}
                            onchange={handleDriverFilter}
                            size="5">
                        </lightning-dual-listbox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-text-align_right">
                        <p class="slds-text-body_small slds-m-top_large">
                            Showing {recordCount} lap times
                        </p>
                    </div>
                </div>

                <!-- Data Table -->
                <lightning-datatable
                    key-field="Id"
                    data={filteredData}
                    columns={columns}
                    sorted-by={sortedBy}
                    sorted-direction={sortDirection}
                    onsort={handleSort}
                    hide-checkbox-column="true"
                    show-row-number-column="false"
                    resize-column-disabled="false">
                </lightning-datatable>
            </template>

            <!-- No Data Message -->
            <template lwc:if={shouldShowNoDataMessage}>
                <div class="slds-align_absolute-center slds-m-vertical_large">
                    <lightning-icon icon-name="utility:info" size="medium" class="slds-m-right_small"></lightning-icon>
                    <span class="slds-text-body_regular">No lap times found for this race.</span>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
